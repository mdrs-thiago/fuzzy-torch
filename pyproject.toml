[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-torch"
version = "0.1.0"
description = "A differentiable Fuzzy Inference System (FIS) library built on PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Thiago Medeiros", email = "mdrs.thiago@gmail.com"}
]
keywords = ["fuzzy", "inference", "pytorch", "mamdani", "membership-functions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.12",
]

[project.urls]
Homepage = "https://github.com/mdrs-thiago/fuzzy_torch"
Issues = "https://github.com/mdrs-thiago/fuzzy_torch/issues"

[tool.setuptools.packages.find]
include = ["fuzzy_torch*"]
